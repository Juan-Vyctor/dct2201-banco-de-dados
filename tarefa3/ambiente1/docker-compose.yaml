services:
  mariadb:
    image: mariadb:11
    container_name: lab-mariadb-ambiente1
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?defina MARIADB_ROOT_PASSWORD no arquivo .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-labdb1}
    ports:
      - "${MARIADB_PORT:-3308}:3306"
    volumes:
      - mariadb_data_1:/var/lib/mysql

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: lab-cloudbeaver-ambiente1
    ports:
      - "${CLOUDBEAVER_PORT:-8978}:8978"
    depends_on:
      - mariadb

volumes:
  mariadb_data_1: